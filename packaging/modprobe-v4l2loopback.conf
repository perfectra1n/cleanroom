# Provision a virtual camera device for Cleanroom.
#
# exclusive_caps=1 is load-bearing: Chromium, Electron, Zoom and Teams all reject a
# loopback node that advertises both output and capture caps, so this forces it to present
# as capture-only once a producer attaches.
#
# NOTE deliberately no video_nr. Cleanroom selects a free device at runtime rather than
# claiming a fixed number, so it cannot fight OBS's virtual camera over /dev/video10. If
# you also run OBS, raise devices= so there is one node for each producer.
#
# CAUTION: `options` lines are per-module and global. modprobe merges every one it finds
# into a single argument list where video_nr, card_label and exclusive_caps are *parallel
# arrays*, so two packages each declaring their own device usually yields neither. If OBS
# or Droidcam already ships a file here, edit that one rather than adding this alongside.
options v4l2loopback devices=2 exclusive_caps=1 card_label="Cleanroom Camera","Virtual Camera" max_buffers=4
