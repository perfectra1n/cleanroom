# Stop PipeWire from holding the physical camera, so Cleanroom can open it directly.
#
# This is not an optimisation. PipeWire's v4l2 SPA node advertises YUY2 only and does not
# pass a UVC camera's MJPG modes through to consumers, and raw 4:2:2 at 1080p saturates
# USB 2 — so anything capturing through PipeWire is structurally pinned to about 5 fps at
# 1080p, with no "prefer MJPEG" knob to fix it. Cleanroom therefore opens /dev/video* itself
# and decodes MJPEG, which needs PipeWire not to be streaming the same device.
#
# THE MATCH MUST BE ON node.nick (or node.name / node.description / api.v4l2.path).
# WirePlumber's v4l2 create-node hook evaluates these rules against the properties that
# exist at creation time, and media.class is NOT among them — a rule matching media.class
# silently never fires, which is a very expensive hour to spend debugging.
#
# Replace the nick below with your camera's, from:  wpctl status
monitor.v4l2.rules = [
  {
    matches = [
      { node.nick = "~.*(Webcam|Camera).*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
