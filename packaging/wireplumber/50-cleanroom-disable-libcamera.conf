# Disable WirePlumber's libcamera monitor.
#
# A UVC webcam gets enumerated twice — once by the v4l2 SPA monitor, which exposes the
# camera's MJPEG modes, and once by libcamera, which for UVC surfaces only RAW/YUYV (so
# 1080p caps at about 5 fps over USB). Which node a consumer binds is effectively a
# coin-flip, so captures randomly land on the slow one. libcamera also tends to hold the
# device fd open continuously, which is the "PipeWire already owns /dev/video0" contention.
#
# Safe for ordinary USB webcams. Revisit only for a sensor that is libcamera-ONLY, such as
# some MIPI/CSI or Intel IPU6 laptop cameras.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
