name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref. The build compiles ONNX Runtime bindings and Slint, so a
# superseded run is expensive to leave running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository, publishes, or comments. Read is all any job
# needs, and saying so at the top covers every job below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every job below is a sibling: they start together and report independently, so a rustfmt
# nit no longer hides whether the tests pass or the shaders still compile. `all checks
# passed` at the bottom is the single status check to point branch protection at.
#
# The repeated checkout/Nix/cache preamble lives in .github/actions/setup-nix, which is
# also where the argument for running everything through `nix develop` is written down.
#
# Deliberately NOT set here: `RUSTFLAGS: -D warnings`. It used to be, under a comment
# claiming it matched `mise run lint` — but mise passes `-D warnings` to clippy alone and
# sets no RUSTFLAGS at all, so the workflow-level version was a divergence from local
# behaviour rather than a mirror of it, and it changed the build fingerprint for every
# other job too. clippy denies warnings on its own line below, exactly as mise does.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cargo cache. rustfmt reads source plus `cargo metadata --no-deps`; it compiles
      # nothing, so there is nothing in target/ worth carrying between runs.
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          cargo-cache-key: clippy
      - run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

  ratchet:
    name: complexity ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          # By far the cheapest cache here: xtask depends on syn, serde, toml and walkdir
          # and on nothing from the workspace, so this target/ never contains ORT, Slint,
          # wgpu or the PipeWire bindings. Sharing a key with clippy or test would mean
          # restoring a multi-gigabyte cache to compile four crates.
          cargo-cache-key: ratchet

      # Two failures, deliberately distinguishable, because they mean opposite things:
      #
      #   exit 1  a number got worse than its recorded ceiling, or crossed a limit with no
      #           entry at all. Split the function, or take the debt on purpose with
      #           `ratchet except` and a written reason. `ratchet record` will not do it
      #           for you — if it could, it would be `--bless`, and the ledger would be a
      #           landfill inside six months.
      #   exit 2  a number got BETTER and ratchet.toml was not re-recorded. Not a
      #           complaint about the change; it is the ratchet doing its only job. A floor
      #           that can drift back up is not a floor.
      #
      # Both messages name the exact command that resolves them, and GITHUB_ACTIONS makes
      # them land as annotations on the offending line rather than as a wall of log.
      - run: nix develop -c cargo run -q -p xtask -- ratchet check

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          cargo-cache-key: test
      # Hardware- and weight-dependent tests skip themselves rather than failing, so this
      # is meaningful on a runner with no camera, no microphone and no model files.
      - run: nix develop -c cargo test --workspace

  gpu:
    name: gpu (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          # --release, unlike clippy and test, so it gets its own cache namespace.
          cargo-cache-key: gpu

      # The whole GPU path is exercisable headlessly. Gpu::pick_best ranks Cpu last
      # deliberately, so lavapipe is never chosen while real hardware exists but is
      # available exactly here.
      #
      # This is the only job that proves the shaders compile and the passes produce the
      # right pixels; the unit tests above cannot, because they have no adapter.
      #
      # The ICD path comes from the dev shell rather than from a `find /nix/store` in this
      # file — see the CLEANROOM_LAVAPIPE_ICD export in flake.nix for why the search
      # approach failed silently. The guards below exist so that a future regression in
      # that export reports itself as a missing ICD rather than as `NoAdapter`, which is
      # what sent the last investigation in the wrong direction.
      - name: gpu_check under lavapipe
        run: |
          # SC2016 is wrong here: the single quotes are the point. These expansions must
          # happen in the inner bash that `nix develop` starts, not in this outer shell,
          # where CLEANROOM_LAVAPIPE_ICD does not exist yet.
          # shellcheck disable=SC2016
          nix develop -c bash -euo pipefail -c '
            icd="${CLEANROOM_LAVAPIPE_ICD:-}"
            if [ -z "$icd" ]; then
              echo "::error::the dev shell did not export CLEANROOM_LAVAPIPE_ICD"
              exit 1
            fi
            if [ ! -f "$icd" ]; then
              echo "::error::lavapipe ICD does not exist: $icd"
              exit 1
            fi
            export VK_DRIVER_FILES="$icd"
            echo "using ICD: $VK_DRIVER_FILES"
            vulkaninfo --summary | grep -E "deviceName|driverName" || true
            cargo run --release -p cleanroom-gpu --example gpu_check
          '

  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cargo cache: nix builds in its own sandbox and never reads ~/.cargo or target/.
      - uses: ./.github/actions/setup-nix
      - run: nix flake check

  nix-build:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix

      # Builds the actual shipped artefact, including the fixed-output derivation for
      # ort's WebGPU prebuilt. Catches the class of breakage that only shows up outside
      # the dev shell — a wrong rpath, a missing runtime library, a hash that drifted.
      - run: nix build .#cleanroom

      # What "the binaries work" can mean here is narrower than it looks:
      #
      #   * cleanroom-ctl uses clap, so `--help` genuinely exercises it and exits 0.
      #   * cleanroomd parses no arguments at all. It ignores `--help` and goes straight
      #     for the config directory and the D-Bus session bus, neither of which exists on
      #     a runner. `cleanroomd --help` therefore failed on every single run and was
      #     papered over with `|| true`.
      #   * cleanroom-gui needs a compositor, so it cannot be launched here either.
      #
      # So test the property this job actually exists to defend — that the shipped
      # binaries find their libraries — by launching each one and failing only on a
      # dynamic linker error. cleanroomd and cleanroom-gui are *expected* to exit
      # non-zero here; what they must not do is die in the loader.
      #
      # Three tempting alternatives, all of which silently pass a broken binary. Each was
      # measured, not reasoned about:
      #
      #   * `ldd result/bin/cleanroomd` — postInstall wrapProgram's all three binaries, so
      #     that path is a bash script. ldd prints "not a dynamic executable", exit 0.
      #   * `ldd` on the real .cleanroomd-wrapped ELF — ldd exits 0 even when it prints
      #     "not found", so `set -e` sails straight past a genuine failure.
      #   * `LD_TRACE_LOADED_OBJECTS=1 result/bin/cleanroomd` — the loader traces bash,
      #     the shebang interpreter, and exits before bash ever execs the real binary. It
      #     prints a healthy-looking trace for a binary whose libraries are missing.
      #
      # This catches libraries needed at startup, which is the rpath-and-closure class the
      # job is named for. It cannot catch a dlopen failure such as libvulkan.so.1 — the
      # gpu job is what covers that.
      - name: every shipped binary finds its libraries
        run: |
          ./result/bin/cleanroom-ctl --help > /dev/null
          echo "cleanroom-ctl --help: ok"

          failed=0
          for bin in cleanroomd cleanroom-gui; do
            out="$(timeout 60 "./result/bin/$bin" 2>&1 </dev/null || true)"
            if grep -qE 'error while loading shared libraries|cannot open shared object file' <<< "$out"; then
              echo "::error::$bin died in the dynamic loader"
              head -20 <<< "$out"
              failed=1
            else
              echo "$bin: cleared the loader"
            fi
          done
          exit "$failed"

  # Single required check. Branch protection points here instead of re-listing every job,
  # so adding a job above does not mean editing repository settings.
  #
  # `if: always()` is load-bearing: without it this job is skipped the moment any
  # dependency fails, and a skipped required check leaves a pull request stuck rather than
  # failed. It has to run and then decide.
  ci:
    name: all checks passed
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, clippy, ratchet, test, gpu, flake-check, nix-build]
    steps:
      # Through env rather than expanded into the script text: an expression inside
      # `run:` is template injection waiting for attacker-influenced context, and even
      # for this benign one, going through env is what keeps zizmor at zero findings.
      - name: results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"

      # 'skipped' counts as a failure too: the only way a job above gets skipped is if
      # something upstream went wrong, and treating that as success would make this gate
      # green on a run that tested nothing.
      - name: fail if any job did not succeed
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
