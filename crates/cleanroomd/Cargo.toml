[package]
name = "cleanroomd"
description = "The Cleanroom daemon: owns the camera, the microphone and the GPU."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cleanroomd"
path = "src/main.rs"

[dependencies]
cleanroom-core = { path = "../cleanroom-core" }
cleanroom-ipc = { path = "../cleanroom-ipc" }
cleanroom-audio = { path = "../cleanroom-audio" }
cleanroom-gpu = { path = "../cleanroom-gpu" }
cleanroom-matting = { path = "../cleanroom-matting" }
cleanroom-video = { path = "../cleanroom-video" }

anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-journald = "0.3"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
# zbus with its DEFAULT (async-io) executor, deliberately not features = ["tokio"].
#
# Enabling zbus's tokio feature switches its executor globally for the whole build graph,
# and `accesskit_unix` — which Slint uses for the AT-SPI accessibility bridge — runs its
# own async-io executor on its own thread and calls zbus from there. With the tokio feature
# on, that call panics ("there is no reactor running") and the accessibility bridge dies,
# silently taking screen-reader support with it. Verified from a backtrace.
#
# zbus does not need the feature: without it, it runs its own small executor, which
# coexists fine with our tokio runtime.
zbus = "5"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Background plates only. default-features = false drops the dozen codecs we have no reason
# to accept — a background image is something the user picked from their own disk, so the
# format list is a choice about attack surface, not about convenience. PNG and JPEG cover
# what a file picker will realistically hand us.
#
# 0.25 is already in Cargo.lock via Slint, so this pulls in nothing new to build.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
