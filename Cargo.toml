[workspace]
resolver = "3"
members = [
    "crates/cleanroom-audio",
    "crates/cleanroom-core",
    "crates/cleanroom-gpu",
    "crates/cleanroom-gui",
    "crates/cleanroom-matting",
    "crates/cleanroom-ipc",
    "crates/cleanroom-video",
    "crates/cleanroomd",
    "crates/cleanroom-ctl",
    "spikes/ort-rvm",
    "spikes/slint-hyprland",
    # Not a product. A member so that `cargo fmt --all`, `cargo clippy --workspace` and
    # `cargo test --workspace` cover it for free — the tool that enforces the repo's
    # standards is held to them. `nix build` is unaffected: cargoBuildFlags in flake.nix
    # names the three shipped binaries explicitly.
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/perfectra1n/cleanroom"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# The video pipeline is latency-sensitive; LTO and a single codegen unit are worth
# the build time. debug=1 keeps frames attributable in perf/flamegraph output.
lto = "thin"
codegen-units = 1
debug = 1
